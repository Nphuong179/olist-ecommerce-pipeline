version: 2

models:
 - name: dim_customers
   description: |
    Type 2 Slowly Changing Dimension tracking customer address history over time.
    Each customer may have multiple records representing different addresses across their lifecycle.
   tests:
   # Ensures each customer has exactly one active record
    - dbt_utils.unique_combination_of_columns:
       combination_of_columns:
        - customer_id
       where: "is_current"

   columns:
    - name: customer_key
      description: "Surrogate key uniquely identifying each customer-address combination."
      tests:
       - unique
       - not_null

    - name: customer_id
      description: |
       Natural key identifying the actual customer person.
       Multiple records with the same customer_id represent address changes over time.
      tests:
       - not_null

    - name: zip_code_prefix
      description: |
       Format: 5-digit numeric string (e.g., 38301, 82200).
       Represents the customer's delivery area.
      tests:
       - not_null
       - dbt_utils.not_empty_string #Catches blank strings that pass not_null test 
    
    - name: city
      description: |
       Brazilian city name in lowercase (e.g., curitiba, sao paulo).
       Identifying area where customer receives deliveries.
      tests:
       - not_null
       - dbt_utils.not_empty_string
      
    - name: state
      description: |
       Brazilian state code
       Format: 2-letter code
       Represents customer's state
      tests:
       - not_null
       - accepted_values:
          values: ['AC', 'AL', 'AP', 'AM', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 'MT', 'MS', 'MG', 'PA',
                   'PB', 'PR', 'PE', 'PI', 'RJ', 'RN', 'RS', 'RO', 'RR', 'SC', 'SP', 'SE', 'TO']

    - name: region
      description: "Customer's region classified by state"
      tests:
       - not_null
       - accepted_values:
          values: ['southeast', 'south', 'northeast', 'central_west', 'north']
      
    - name: first_order_date
      description: |
       Timestamp of customer's first order. 
       Remains constant across all records for the same customer_id.
      tests:
       - not_null
    
    - name: last_order_date
      description: |
       Timestamp of customer's most recent order.
       Remains constant across all records for the same customer_id.
       Used to identify active vs. not active customers.
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">= first_order_date"
          config:
           severity: error

    - name: valid_from
      description: |
       Timestamp when this address record active
       Defines the start of validity period for Type 2 SCD tracking
      tests:
       - not_null
      
    - name: valid_to
      description: |
       Timestamp when this address record became inactive.
       Set to '9999-12-31' for current address.
       Defines the end of validity period.
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">= valid_from"
          config:
           severity: error

    - name: is_current
      description: |
       Boolean flag indicating whether this address record is active.
       TRUE for current address. FALSE for historical.
      tests:
       - accepted_values:
          values: [true, false]

    - name: updated_at
      description: "Timestamp when this record was updated in the data warehouse"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">= valid_from"

 - name: dim_sellers
   description: |
    Type 2 Slowly Changing Dimension tracking seller address history over time.
    Each seller may have multiple records representing different addresses across their lifecycle.
   tests:
   # Ensures each seller has exactly one active record
    - dbt_utils.unique_combination_of_columns:
       combination_of_columns:
        - seller_id
       where: "is_current"
   
   columns:
    - name: seller_key
      description: "Surrogate key uniquely identifying each seller-address combination."
      tests:
       - not_null
       - unique
    
    - name: seller_id
      description: |
       Natural key identifying the actual seller person.
       Multiple records with the same seller_id represent address changes over time.
      tests:
       - not_null

    - name: zip_code_prefix
      description: |
       Format: 5-digit numeric string (e.g., 38301, 82200).
       Represents the seller's area.
      tests:
       - not_null
       - dbt_utils.not_empty_string #Catches blank strings that pass not_null test 

    - name: city
      description: |
       Brazilian city name in lowercase (e.g., curitiba, sao paulo).
       Identifying area where seller delivers goods.
      tests:
       - not_null
       - dbt_utils.not_empty_string
      
    - name: state
      description: |
       Brazilian state code
       Format: 2-letter code
       Represents seller's state
      tests:
       - not_null
       - accepted_values:
          values: ['AC', 'AL', 'AP', 'AM', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 'MT', 'MS', 'MG', 'PA',
                   'PB', 'PR', 'PE', 'PI', 'RJ', 'RN', 'RS', 'RO', 'RR', 'SC', 'SP', 'SE', 'TO']

    - name: region
      description: "Seller's region classified by state"
      tests:
       - not_null
       - accepted_values:
          values: ['southeast', 'south', 'northeast', 'central_west', 'north']
      
    - name: first_order_date
      description: |
       Timestamp of seller's first order. 
       Remains constant across all records for the same seller_id.
      tests:
       - not_null
    
    - name: last_order_date
      description: |
       Timestamp of seller's most recent order.
       Remains constant across all records for the same seller_id.
       Used to identify active vs. not active sellers.
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">= first_order_date"
          config:
           severity: error

    - name: valid_from
      description: |
       Timestamp when this address record active
       Defines the start of validity period for Type 2 SCD tracking
      tests:
       - not_null
      
    - name: valid_to
      description: |
       Timestamp when this address record became inactive.
       Set to '9999-12-31' for current address.
       Defines the end of validity period.
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">= valid_from"
          config:
           severity: error

    - name: is_current
      description: |
       Boolean flag indicating whether this address record is active.
       TRUE for current address. FALSE for historical.
      tests:
       - accepted_values:
          values: [true, false]

    - name: updated_at
      description: "Timestamp when this record was updated in the data warehouse"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">= valid_from"

 - name: dim_products
   description: |
    Dimension providing product information about physical dimensions, product listing attributes 
    and historical price metrics.
   tests:
    - dbt_utils.expression_is_true:
       expression: "avg_price BETWEEN min_price AND max_price"

   columns:
    - name: product_id
      description: "Unique identifier for product"
      tests:
       - not_null
       - unique

    - name: category_name_portuguese
      description: "Original Brazilian Portuguese product category name"
      tests:
       - not_null

    - name: category_name_english
      description: "English translation of product category"
      tests:
       - not_null

    - name: name_length
      description: |
       Character count of product name.
       Note: Product name is not available for privacy.
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">=0"
          config:
           severity: warn
      
    - name: description_length
      description: |
       Character count of product description.
       Note: Product description is not available for privacy.
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">=0"
          config:
           severity: warn

    - name: photo_quantity
      description: "Number of product photo in the listing"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">=0"
          config:
           severity: warn

    - name: weight_gram
      description: "Product weight in gram"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">=0"

    - name: length_cm
      description: "Product length in centimeters"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">=0"

    - name: width_cm
      description: "Product width in centimeters"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">=0"

    - name: height_cm
      description: "Product height in centimeters"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">=0"

    - name: weight_category
      description: "Product weight classification"
      tests:
       - accepted_values: 
          values: ['light', 'medium', 'heavy']

    - name: size_category
      description: "Product size classification"
      tests:
       - accepted_values:
          values: ['small', 'medium', 'large']
    
    - name: has_complete_listing
      description: "Derived flag idicating whether product has complete description listing"
      tests:
       - accepted_values:
          values: [true, false]

    - name: first_order_date
      description: "Timestamp of product's first order"
      tests:
       - not_null

    - name: unique_seller_count
      description: "Number of sellers who sell the product"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">=0"

    - name: total_orders_containing_product
      description: "Lifetime order count of the product"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">=0"

    - name: total_units_sold
      description: "Lifetime total units sold"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">=0"
        
    - name: min_price
      description: "Lowest price the product was ever sold"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">=0"

    - name: max_price
      description: "Highest price the product was ever sold"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">= min_price"
    
    - name: avg_price
      description: "Average selling price across all transactions"
      tests:
       - not_null
       - dbt_utils.expression_is_true:
          expression: ">= min_price"
    
    - name: price_variation_coefficient
      description: |
       Standard deviation as a percentage of the average.
       Measures how spread out the prices are from the average.
      tests:
       - not_null

    - name: price_variation_category
      description: "Price variation coefficient classification"
      tests:
       - accepted_values:
          values: ['no_sales', 'high_variation', 'moderate_variation', 'low_variation', 'fixed_price']
          
    - name: updated_at
      description: "Timestamp when this record was last updated in the data warehouse"
      tests:
       - not_null