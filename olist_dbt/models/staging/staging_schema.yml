version: 2

models:
 - name: stg_customers
   columns:
    - name: order_customer_id
      tests:
       - not_null
       - unique
      
    - name: customer_id
      tests:
       - not_null
      
    - name: zip_code_prefix
      tests: 
       - not_null
      
    - name: city
      tests:
       - not_null
        
    - name: state
      tests:
       - not_null

 - name: stg_products

   columns:
    - name: product_id
      tests: 
       - not_null
       - unique
      
    - name: category_name_portuguese
      tests:
       - not_null:
          config:
           severity: warn

    - name: name_length
      tests:
       - not_null:
          config:
           severity: warn

    - name: description_length # not_null test should be in dim_schema for business rule

    - name: photo_quantity # not_null test should be in dim_schema for business rule

    - name: weight_gram
      tests:
       - not_null:
          config:
           severity: warn
         
    - name: length_cm
      tests:
       - not_null:
          config:
           severity: warn

    - name: width_cm
      tests:
       - not_null:
          config:
           severity: warn

    - name: height_cm
      tests:
       - not_null:
          config:
           severity: warn

 - name: stg_sellers
   
   columns:
    - name: seller_id
      tests:
       - not_null
       - unique

    - name: zip_code_prefix
      tests:
       - not_null
      
    - name: city
      tests:
       - not_null
      
    - name: state
      tests:
       - not_null
    
 - name: stg_orders
   columns:
    - name: order_id
      tests:
       - not_null
       - unique

    - name: order_customer_id
      tests:
       - not_null
    
    - name: order_status
      tests:
       - not_null

    - name: order_purchase_timestamp
      tests:
       - not_null

    - name: order_approved_timestamp # not not_null test involved. Column can have null value.

    - name: order_delivered_carrier_timestamp

    - name: order_delivered_customer_timestamp

    - name: order_estimated_delivery_date
      tests:
       - not_null

 - name: stg_order_items
   columns:
    - name: order_id
      tests:
       - not_null
       - relationships:
          to: ref('stg_orders')
          field: order_id

    - name: item_sequence_number
      tests:
       - not_null

    - name: product_id
      tests:
       - not_null

    - name: seller_id
      tests:
       - not_null

    - name: price
      tests:
       - not_null

    - name: freight_value
      tests:
       - not_null
    
    - name: shipping_limit_timestamp
      tests:
       - not_null
    
 - name: stg_order_payments
   columns:
    - name: order_id
      tests:
       - not_null
       - relationships:
          to: ref('stg_orders')
          field: order_id

    - name: payment_transaction_number
      tests:
       - not_null

    - name: payment_type
      tests:
       - not_null
    
    - name: payment_installments
      tests:
       - not_null

    - name: payment_value
      tests:
       - not_null
 - name: stg_order_reviews
   columns:
    - name: review_id
      tests:
      # review_id is not unique in the source dataset. Many review_ids appear across multiple order_id.
       - not_null

    - name: order_id
      tests:
       - not_null
       - relationships:
          to: ref('stg_orders')
          field: order_id

    - name: review_score
      tests:
       - not_null

    - name: review_title

    - name: review_message

    - name: review_created_timestamp
      tests:
       - not_null

    - name: review_answer_timestamp
 - name: stg_product_category_translation
   columns:
    - name: category_name_portuguese
      tests:
       - unique
       - not_null
    
    - name: category_name_english
      tests:
       - not_null